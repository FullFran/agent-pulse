# agent-pulse — tmux layer.
#
# Source this at the END of your tmux config, after your theme and after TPM:
#
#     source-file ~/.config/agent-pulse/tmux/agents.conf
#
# What it turns on by default is BEHAVIOUR only: the self-heal hooks that clear
# an attention state once you have actually looked at it. It does not touch how
# your status line looks, because overwriting window-status-format would throw
# away whatever your theme built.
#
# Rendering is opt-in. Pick one of the two options at the bottom.

# ── behaviour ───────────────────────────────────────────────────────────────
# Looking at a window is the event that never gets emitted. Cancel a permission
# prompt and no agent hook fires, so without this the pane stays "blocked"
# forever. These hooks treat navigation as the missing clear.
set-hook -g after-select-window    'run-shell -b "~/.config/agent-pulse/scripts/agent-heal"'
set-hook -g after-select-pane      'run-shell -b "~/.config/agent-pulse/scripts/agent-heal"'
set-hook -g pane-focus-in          'run-shell -b "~/.config/agent-pulse/scripts/agent-heal"'
set-hook -g client-session-changed 'run-shell -b "~/.config/agent-pulse/scripts/agent-heal"'

# Keep the status line refreshing so state changes appear without input.
set -g status-interval 2

# ── rendering, option A: compose it yourself (recommended) ──────────────────
# Nothing is overwritten. Interpolate this fragment wherever you want the marker
# to appear inside your own window-status-format:
#
#   #{?#{==:#{@win_agent_state},blocked}, #[fg=red]●#[default],\
#   #{?#{==:#{@win_agent_state},error}, #[fg=red]✗#[default],\
#   #{?#{==:#{@win_agent_state},working}, #[fg=yellow]○#[default],}}}
#
# The pane-level value is @agent_state and the window rollup is @win_agent_state
# (worst pane wins: error > blocked > working > idle). @agent_msg carries the
# optional label, e.g. the text of a permission prompt.

# ── rendering, option B: let agent-pulse do it ──────────────────────────────
# Set this BEFORE sourcing the file to get a plain, theme-agnostic format:
#
#     set -g @agent_pulse_auto_format on
#
# It appends a coloured marker to a minimal "index name" layout. Use it only if
# you have no theme worth preserving — it replaces window-status-format.
if-shell -F '#{==:#{@agent_pulse_auto_format},on}' {
  set -g window-status-format         "#[fg=colour245] #I #W#{?#{==:#{@win_agent_state},blocked}, #[fg=red]●,#{?#{==:#{@win_agent_state},error}, #[fg=red]✗,#{?#{==:#{@win_agent_state},working}, #[fg=yellow]○,}}}#[default]"
  set -g window-status-current-format "#[fg=colour252,bold] #I #W#{?#{==:#{@win_agent_state},blocked}, #[fg=red]●,#{?#{==:#{@win_agent_state},error}, #[fg=red]✗,#{?#{==:#{@win_agent_state},working}, #[fg=yellow]○,}}}#[default]"
}
